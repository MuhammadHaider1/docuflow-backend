[pytest]
# Only collect the real suite. Developer utilities that talk to a live
# database live in scripts/ and are run manually, not by pytest.
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Surface a warning if an async test is ever added without the marker.
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
    default
