name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.15.21

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format
        run: ruff format --check src/ tests/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Settings are validated at import time, so the required keys must be
      # present even though the suite runs against a mocked database session.
      - name: Run tests
        env:
          SECRET_KEY: ci-dummy-secret-key-not-used-for-any-real-signing
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: docuflow_ci
          MINIO_ENDPOINT: localhost:9100
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET_NAME: docuflow-ci
          MINIO_SECURE: "False"
        run: pytest -q

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a secret committed and later removed is still caught.
          fetch-depth: 0

      - name: Fail if a .env was ever committed
        run: |
          if git log --all --diff-filter=A --name-only --pretty=format: \
               | grep -qxE '\.env$'; then
            echo "::error::A .env file was committed to this repository."
            exit 1
          fi
          echo "No .env in history. Good."

      - name: Fail on common secret patterns in current tree
        run: |
          # Matches the values that were live before rotation: DB password,
          # MinIO defaults, a Google API key, and a HuggingFace token.
          if git grep -nIE \
              '(AIza[0-9A-Za-z_-]{35}|hf_[0-9A-Za-z]{30,}|BEGIN [A-Z ]*PRIVATE KEY)' \
              -- . ':!*.example' ':!.github/workflows/*'; then
            echo "::error::Possible committed secret found."
            exit 1
          fi
          echo "No secret patterns in tree. Good."
