# Host ports are overridable so a developer's machine can avoid local conflicts,
# e.g. put MINIO_API_PORT=9000 in .env to fall back to the MinIO default.
services:
  db:
    image: pgvector/pgvector:pg15
    container_name: docuflow_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-docuflow}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docuflow_network

  redis:
    image: redis:7-alpine
    container_name: docuflow_redis
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - docuflow_network

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: docuflow_minio
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - docuflow_network

volumes:
  postgres_data:
  minio_data:

networks:
  docuflow_network:
    driver: bridge
