services:
  db:
    image: pgvector/pgvector:pg15
    container_name: docuflow_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-docuflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docuflow_network

  redis:
    image: redis:7-alpine
    container_name: docuflow_redis
    ports:
      - "6380:6379"
    networks:
      - docuflow_network

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: docuflow_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - docuflow_network

volumes:
  postgres_data:
  minio_data:

networks:
  docuflow_network:
    driver: bridge